name: Supabase backup

on:
  schedule:
    # svakog ponedeljka u 04:43 UTC
    - cron: "43 4 * * 1"
  workflow_dispatch: {} # rucno pokretanje, za test

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instaliraj postgresql-client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges \
            -f backup-$(date +%Y-%m-%d).sql
          ls -lh backup-*.sql

      - name: Sacuvaj backup kao artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90
